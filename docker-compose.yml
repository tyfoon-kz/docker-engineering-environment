services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ecommerce-app
    working_dir: /app
    command: ["sh", "-lc", "php -v && composer --version && sleep infinity"]
    environment:
      APP_ENV: local
      COMPOSER_HOME: /tmp/composer
      PHP_IDE_CONFIG: serverName=ecommerce.localho.st
    volumes:
      - ./:/app

