services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ecommerce-platform/app:local
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - app-network

networks:
  app-network:
    name: ecommerce-platform-local

volumes:
  postgres-data:
    name: ecommerce-platform-postgres-data
  redis-data:
    name: ecommerce-platform-redis-data

