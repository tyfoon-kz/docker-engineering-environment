services:
  app:
    image: php:8.3-cli
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-phpstorm-app
    working_dir: /var/www/html
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${PHPSTORM_APP_PORT:-8080}:8080"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      IDE_RUNTIME_NOTE: "PhpStorm connects to Docker; PHP interpreter is configured separately."
