services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6.14}
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - "--providers.docker.constraints=Label(`traefik.scope`, `${COMPOSE_STACK_NAME:-ecommerce}`)"
      - --providers.docker.network=${COMPOSE_STACK_NAME:-ecommerce}_web
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  storefront:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-storefront
    restart: unless-stopped
    volumes:
      - ./services/storefront:/usr/share/nginx/html:ro
    labels:
      - "traefik.scope=${COMPOSE_STACK_NAME:-ecommerce}"
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_STACK_NAME:-ecommerce}_web"
      - "traefik.http.routers.${COMPOSE_STACK_NAME:-ecommerce}-storefront.rule=Host(`${APP_DOMAIN:-ecommerce.localho.st}`)"
      - "traefik.http.routers.${COMPOSE_STACK_NAME:-ecommerce}-storefront.entrypoints=web"
      - "traefik.http.services.${COMPOSE_STACK_NAME:-ecommerce}-storefront.loadbalancer.server.port=80"
    networks:
      - web

  api:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-api
    restart: unless-stopped
    volumes:
      - ./services/api:/usr/share/nginx/html:ro
    labels:
      - "traefik.scope=${COMPOSE_STACK_NAME:-ecommerce}"
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_STACK_NAME:-ecommerce}_web"
      - "traefik.http.routers.${COMPOSE_STACK_NAME:-ecommerce}-api.rule=Host(`${API_DOMAIN:-api.ecommerce.localho.st}`)"
      - "traefik.http.routers.${COMPOSE_STACK_NAME:-ecommerce}-api.entrypoints=web"
      - "traefik.http.services.${COMPOSE_STACK_NAME:-ecommerce}-api.loadbalancer.server.port=80"
    networks:
      - web

  admin:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-admin
    restart: unless-stopped
    volumes:
      - ./services/admin:/usr/share/nginx/html:ro
    labels:
      - "traefik.scope=${COMPOSE_STACK_NAME:-ecommerce}"
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_STACK_NAME:-ecommerce}_web"
      - "traefik.http.routers.${COMPOSE_STACK_NAME:-ecommerce}-admin.rule=Host(`${ADMIN_DOMAIN:-admin.ecommerce.localho.st}`)"
      - "traefik.http.routers.${COMPOSE_STACK_NAME:-ecommerce}-admin.entrypoints=web"
      - "traefik.http.services.${COMPOSE_STACK_NAME:-ecommerce}-admin.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    name: ${COMPOSE_STACK_NAME:-ecommerce}_web
    driver: bridge
