services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ecommerce-platform/app:local
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-ecommerce-platform}
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PUBLISHED_PORT:-8080}:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecommerce}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - app-network

networks:
  app-network:
    name: ${COMPOSE_STACK_NAME:-ecommerce-platform}-local

volumes:
  postgres-data:
    name: ${COMPOSE_STACK_NAME:-ecommerce-platform}-postgres-data
  redis-data:
    name: ${COMPOSE_STACK_NAME:-ecommerce-platform}-redis-data
