services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-phpstorm-interpreter-app
    working_dir: /var/www/html
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${PHPSTORM_APP_PORT:-8080}:8080"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      COMPOSER_ALLOW_SUPERUSER: "1"
