services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6.14}
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_STACK_NAME:-ecommerce}_web
      - --api.dashboard=true
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DASHBOARD_DOMAIN:-traefik.ecommerce.localho.st}`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
    networks:
      - web

  storefront:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-storefront
    restart: unless-stopped
    volumes:
      - ./services/storefront:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_STACK_NAME:-ecommerce}_web"
      - "traefik.http.routers.storefront.rule=Host(`${APP_DOMAIN:-ecommerce.localho.st}`)"
      - "traefik.http.routers.storefront.entrypoints=web"
      - "traefik.http.services.storefront.loadbalancer.server.port=80"
    networks:
      - web

  api:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-api
    restart: unless-stopped
    volumes:
      - ./services/api:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_STACK_NAME:-ecommerce}_web"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN:-api.ecommerce.localho.st}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    networks:
      - web

  admin:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_STACK_NAME:-ecommerce}-admin
    restart: unless-stopped
    volumes:
      - ./services/admin:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_STACK_NAME:-ecommerce}_web"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:-admin.ecommerce.localho.st}`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.services.admin.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    name: ${COMPOSE_STACK_NAME:-ecommerce}_web
    driver: bridge
