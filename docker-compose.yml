services:
  app:
    image: php:8.5-cli
    container_name: ecommerce-app
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /var/www/html
    command: sh -lc "mkdir -p storage/logs bootstrap/cache && php -S 0.0.0.0:8080 -t public"
    volumes:
      - ./:/var/www/html
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$r=@file_get_contents(\"http://127.0.0.1:8080\"); exit($$r===false?1:0);'",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - web
      - internal

  postgres:
    image: postgres:18-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecommerce} -d ${DB_DATABASE:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - internal

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
