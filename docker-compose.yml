services:
  valkey:
    image: valkey/valkey:8.0
    container_name: ecommerce-health-valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: nginx:1.29-alpine
    container_name: ecommerce-health-app
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "18082:80"
    volumes:
      - ./services/app:/usr/share/nginx/html:ro
